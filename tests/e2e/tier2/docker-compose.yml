# Pinned so concurrent runs in sibling plugin repositories do not share
# one Compose project. Without this the name defaults to the directory
# basename - "tier2" in every repository - and an unrelated "docker compose
# down -v" tears down this stack mid-run.
name: whmcs-spectrocoin-tier2

# Tier 2: a real WHMCS, and a stand-in SpectroCoin API that answers as
# spectrocoin.com inside this network.
#
# WHMCS is licensed software and is never committed here: the harness reads the
# release zip from a local path you supply (WHMCS_PACKAGE).
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: whmcs
    healthcheck:
      # Asserts the DATABASE exists, not merely that the server answers.
      test: ["CMD-SHELL", "mariadb -uroot -proot -e 'USE whmcs' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  spectrocoin:
    build:
      context: ./stub
    networks:
      default:
        aliases:
          - spectrocoin.com
    volumes:
      - ./.certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/__test/requests"]
      interval: 5s
      timeout: 5s
      retries: 30

  whmcs:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      spectrocoin:
        condition: service_healthy
    networks:
      default:
        # The plugin rejects a callbackUrl whose host has no dot. The second
        # alias exists so a node-locked WHMCS licence, which is issued against a
        # specific domain, can validate - set WHMCS_DOMAIN to match yours.
        aliases:
          - shop.test
          - ${WHMCS_DOMAIN:-shop.test}
    volumes:
      - ./.certs:/certs:ro
    ports:
      - "8092:80"
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
